<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Church and Venue Tracker</title>
  
  <!-- Leaflet CSS -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
  />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100vh; width: 100vw; z-index: 1; }

    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      background-color: #ffffff;
      color: #333333;
      border: 2px solid #e0e0e0;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }

    .btn:hover { background-color: #f8f9fa; transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .btn.active {
      background-color: #4A90E2;
      color: #ffffff;
      border-color: #4A90E2;
    }

    /* Left Bottom Overlay Container */
    .bottom-left-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }

    .btn-refresh {
      background-color: #ffffff;
      color: #333333;
      border: 1px solid #cccccc;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-refresh:disabled {
      background-color: #e0e0e0;
      color: #888888;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status-badge {
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="btnChurch" class="btn">Route to Church</button>
    <button id="btnVenue" class="btn">Route to Reception Venue</button>
  </div>

  <div class="bottom-left-panel">
    <button id="btnRefresh" class="btn-refresh">↻ Refresh Location</button>
    <div id="status" class="status-badge">Locating user...</div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const ORS_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImJhMDc2OGQzZGRhMDQyZGY4ZDVjYjkyZDNmOTI2MjZkIiwiaCI6Im11cm11cjY0In0=";

    const DESTINATIONS = {
      church: {
        lat: 14.578127100307324, 
        lng: 121.11579712637148, 
        name: "Diocesan Shrine"
      },
      venue: {
        lat: 14.586464714471187,
        lng: 121.07877224052307, 
        name: "Shakey's Tiendesitas"
      }
    };

    // Auto-update location every 5 minutes (300,000 ms)
    const AUTO_UPDATE_INTERVAL_MS = 300000; 
    const COOLDOWN_SECONDS = 60;

    // Initialize map centered immediately on Church
    const map = L.map('map').setView([DESTINATIONS.church.lat, DESTINATIONS.church.lng], 14);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '© OpenStreetMap contributors © CARTO'
    }).addTo(map);

    let userLocation = null;
    let userMarker = null;
    let currentRoutePolyline = null;
    let targetDestination = DESTINATIONS.church; 
    let cooldownTimer = null;

    // Static Markers
    L.marker([DESTINATIONS.church.lat, DESTINATIONS.church.lng])
      .addTo(map)
      .bindPopup(`<b>${DESTINATIONS.church.name}</b>`);

    L.marker([DESTINATIONS.venue.lat, DESTINATIONS.venue.lng])
      .addTo(map)
      .bindPopup(`<b>${DESTINATIONS.venue.name}</b>`);

    // Cache to store fetched routes so switching buttons is instant
    const routeCache = {};

    async function drawRoute(startCoords, destCoords) {
      const startLngLat = `${startCoords[1]},${startCoords[0]}`;
      const destLngLat = `${destCoords.lng},${destCoords.lat}`;
      const cacheKey = `${startLngLat}->${destLngLat}`;

      // Instant response if route was previously fetched
      if (routeCache[cacheKey]) {
        renderPolyline(routeCache[cacheKey]);
        return;
      }

      // Draw immediate fallback line while waiting for network API
      renderPolyline([startCoords, [destCoords.lat, destCoords.lng]], true);

      const url = `https://api.openrouteservice.org/v2/directions/driving-car?api_key=${ORS_API_KEY}&start=${startLngLat}&end=${destLngLat}`;

      try {
        const response = await fetch(url, { headers: { 'Accept': 'application/json, application/geo+json' } });
        const data = await response.json();

        if (data.features && data.features.length > 0) {
          const routeCoords = data.features[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
          
          // Save to cache
          routeCache[cacheKey] = routeCoords;
          
          // Only draw if target destination hasn't changed during fetch
          if (targetDestination === destCoords) {
            renderPolyline(routeCoords);
          }
        }
      } catch (err) {
        console.error("Routing error:", err);
      }
    }

    function renderPolyline(coordinates, isTemporary = false) {
      if (currentRoutePolyline) {
        map.removeLayer(currentRoutePolyline);
      }

      currentRoutePolyline = L.polyline(coordinates, { 
        color: '#4A90E2', 
        weight: 5, 
        opacity: isTemporary ? 0.4 : 0.9,
        dashArray: isTemporary ? '8, 8' : null,
        lineJoin: 'round'
      }).addTo(map);

      map.fitBounds(currentRoutePolyline.getBounds(), { padding: [50, 50] });
    }

    // Single-shot position update to conserve API calls
    function fetchUserLocation(isManualTrigger = false) {
      if (!navigator.geolocation) {
        document.getElementById('status').innerText = "Geolocation not supported";
        return;
      }

      const statusEl = document.getElementById('status');
      if (isManualTrigger) statusEl.innerText = "Refreshing location...";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          userLocation = [lat, lng];

          const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          statusEl.innerText = `Updated: ${timeString}`;

          if (userMarker) {
            userMarker.setLatLng(userLocation);
          } else {
            userMarker = L.circleMarker(userLocation, {
              color: '#1E88E5',
              fillColor: '#1E88E5',
              fillOpacity: 0.8,
              radius: 8
            }).addTo(map).bindPopup("Your Location");
          }

          drawRoute(userLocation, targetDestination);
        },
        (error) => {
          console.warn("Geolocation error:", error);
          switch(error.code) {
            case error.PERMISSION_DENIED:
              statusEl.innerText = "Location permission denied";
              break;
            case error.POSITION_UNAVAILABLE:
              statusEl.innerText = "Searching for GPS signal...";
              break;
            case error.TIMEOUT:
              statusEl.innerText = "Location request timed out";
              break;
            default:
              statusEl.innerText = "Location unavailable";
          }
        },
        { 
          enableHighAccuracy: true, 
          maximumAge: 5000, 
          timeout: 10000 
        }
      );
    }

    // Handles the 60-second cooldown for the manual refresh button
    function startRefreshCooldown() {
      const btnRefresh = document.getElementById('btnRefresh');
      btnRefresh.disabled = true;

      let remaining = COOLDOWN_SECONDS;
      btnRefresh.innerText = `Wait ${remaining}s...`;

      cooldownTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(cooldownTimer);
          btnRefresh.disabled = false;
          btnRefresh.innerText = "↻ Refresh Location";
        } else {
          btnRefresh.innerText = `Wait ${remaining}s...`;
        }
      }, 1000);
    }

    // Event listener for manual refresh
    document.getElementById('btnRefresh').addEventListener('click', () => {
      fetchUserLocation(true);
      startRefreshCooldown();
    });

    // Initial check on page load & 5-minute background auto-update
    fetchUserLocation();
    setInterval(() => fetchUserLocation(), AUTO_UPDATE_INTERVAL_MS);

    // Button Handlers
    const btnChurch = document.getElementById('btnChurch');
    const btnVenue = document.getElementById('btnVenue');

    function setActiveButton(activeBtn) {
      btnChurch.classList.remove('active');
      btnVenue.classList.remove('active');
      activeBtn.classList.add('active');
    }

    setActiveButton(btnChurch);

    btnChurch.addEventListener('click', () => {
      targetDestination = DESTINATIONS.church;
      setActiveButton(btnChurch);
      
      if (userLocation) {
        drawRoute(userLocation, targetDestination);
      } else {
        map.flyTo([DESTINATIONS.church.lat, DESTINATIONS.church.lng], 15, { animate: true });
      }
    });

    btnVenue.addEventListener('click', () => {
      targetDestination = DESTINATIONS.venue;
      setActiveButton(btnVenue);
      
      if (userLocation) {
        drawRoute(userLocation, targetDestination);
      } else {
        map.flyTo([DESTINATIONS.venue.lat, DESTINATIONS.venue.lng], 15, { animate: true });
      }
    });
  </script>
</body>
</html>
